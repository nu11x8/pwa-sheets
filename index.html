<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0f7b5f">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icon-192.png">
<link rel="apple-touch-icon" href="icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<title>シート送信メモ</title>
<style>
  :root { --bg:#f6f8f7; --fg:#1b2420; --card:#fff; --line:#d5ddd9; --muted:#5d6b64; --accent:#0f7b5f; --on-accent:#fff; --chip:#eaf3ef; --err:#b3261e; }
  @media (prefers-color-scheme: dark) {
    :root { --bg:#121815; --fg:#e6ede9; --card:#1b2420; --line:#33403a; --muted:#9db0a6; --accent:#3fb994; --on-accent:#08201a; --chip:#22302a; --err:#f2938d; }
  }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--fg);
    font-family: system-ui, -apple-system, "Hiragino Sans", "Yu Gothic UI", Meiryo, sans-serif;
    padding: max(16px, env(safe-area-inset-top)) 16px max(16px, env(safe-area-inset-bottom)); }
  main { max-width: 480px; margin: 0 auto; }
  h1 { font-size:1.25rem; margin:8px 0 16px; }
  .summary { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:12px 16px; margin-bottom:12px; }
  .summary h2 { font-size:.85rem; font-weight:600; margin:0 0 8px; color:var(--muted); }
  .sum-row { display:grid; grid-template-columns:1fr 1fr; gap:12px; }
  .sum-row div { display:grid; gap:2px; }
  .sum-row small { color:var(--muted); font-size:.8rem; }
  .sum-row strong { font-size:1.3rem; font-variant-numeric:tabular-nums; }
  #sumNote { font-size:.75rem; color:var(--muted); margin:8px 0 0; min-height:1em; }
  form { background:var(--card); border:1px solid var(--line); border-radius:12px; padding:16px; display:grid; grid-template-columns:minmax(0,1fr); gap:18px; }
  .field { display:grid; gap:6px; min-width:0; }
  .field > span, legend { font-size:.9rem; font-weight:600; }
  fieldset { border:0; padding:0; margin:0; display:grid; gap:8px; }
  input, select, textarea { font:inherit; width:100%; padding:10px; border:1px solid var(--line); border-radius:8px; background:var(--bg); color:var(--fg); }
  input[type="date"] { -webkit-appearance:none; appearance:none; display:block; min-width:0; max-width:100%; min-height:2.8rem; text-align:left; }
  input[type="date"]::-webkit-date-and-time-value { text-align:left; }
  input:focus-visible, select:focus-visible, textarea:focus-visible, button:focus-visible { outline:2px solid var(--accent); outline-offset:1px; }
  .chips { display:flex; flex-wrap:wrap; gap:8px; }
  .chip { font:inherit; padding:8px 14px; border:1px solid var(--line); border-radius:999px; background:var(--chip); color:var(--fg); cursor:pointer; }
  .chip[aria-pressed="true"] { background:var(--accent); color:var(--on-accent); border-color:var(--accent); font-weight:600; }
  .chip.add { background:transparent; border-style:dashed; color:var(--accent); }
  .add-row { display:none; gap:8px; }
  .add-row.open { display:flex; }
  .add-row input { flex:1; }
  .btn { font:inherit; font-weight:600; padding:10px 14px; border:0; border-radius:8px; background:var(--accent); color:var(--on-accent); cursor:pointer; white-space:nowrap; }
  .btn:disabled { opacity:.6; cursor:default; }
  .btn.sub { background:transparent; color:var(--muted); border:1px solid var(--line); }
  .amount { position:relative; }
  .amount input { padding-right:36px; text-align:right; font-size:1.15rem; }
  .amount b { position:absolute; right:12px; top:50%; transform:translateY(-50%); color:var(--muted); font-weight:400; }
  .submit { padding:14px; font-size:1rem; }
  #status { min-height:1.5em; margin:12px 2px 0; font-size:.9rem; color:var(--accent); }
  #status.err { color:var(--err); }
  .pending-row { display:flex; flex-wrap:wrap; align-items:center; gap:10px; min-height:2.4em; margin:4px 2px; font-size:.85rem; color:var(--muted); }
  .pending-row .btn { padding:6px 12px; font-size:.85rem; }
  .ver { font-size:.7rem; color:var(--muted); margin:16px 2px 0; }
</style>
</head>
<body>
<main>
  <section class="summary" aria-label="今月の合計">
    <h2 id="sumTitle">今月の合計</h2>
    <div class="sum-row">
      <div><small>食費</small><strong id="sumFood">—</strong></div>
      <div><small>外食</small><strong id="sumEat">—</strong></div>
    </div>
    <p id="sumNote"></p>
  </section>

  <form id="form" novalidate>
    <label class="field"><span>日付</span><input type="date" id="date"></label>

    <label class="field"><span>項目</span>
      <select id="category">
        <option selected>食費</option><option>電気</option><option>ガス</option><option>水道</option>
        <option>外食</option><option>交際</option><option>日用品</option><option>交通費</option><option>その他</option>
      </select>
    </label>

    <fieldset>
      <legend>店</legend>
      <div class="chips" id="stores"></div>
      <div class="add-row" id="addRow">
        <input type="text" id="newStore" placeholder="店名を入力" maxlength="20" aria-label="新しい店名">
        <button type="button" class="btn" id="addOk">追加</button>
        <button type="button" class="btn sub" id="addCancel">やめる</button>
      </div>
    </fieldset>

    <label class="field"><span>金額</span>
      <div class="amount">
        <input type="text" id="amount" inputmode="numeric" pattern="[0-9]*" placeholder="0" autocomplete="off">
        <b>円</b>
      </div>
    </label>

    <label class="field"><span>メモ</span><textarea id="memo" rows="2"></textarea></label>

    <button type="submit" class="btn submit" id="submit">送信</button>
  </form>
  <p id="status" role="status" aria-live="polite"></p>
  <div class="pending-row"><span id="pending"></span><button type="button" class="btn sub" id="flushNow" hidden>今すぐ送信</button><button type="button" class="btn sub" id="clearQueue" hidden>未送信を削除</button></div>
  <p class="ver">app v8</p>
</main>

<script>
// ▼ 設置時にここを書き換える ▼
const GAS_URL = "https://script.google.com/macros/s/AKfycbwPtZkW_kCLEdmSP6Q7R_F8AqckoAd6bLyv7LoLDVNOv6jTJaM5qx5Soey1l5geP9lPzw/exec"; // Apps Script のウェブアプリURL
const SECRET  = "change-me";                                         // Code.gs の SECRET と同じ値
// ▲ ここまで ▲

const QUEUE_KEY = "pending-rows", STORE_KEY = "stores", SUM_KEY = "summary-cache";
const DEFAULT_STORES = ["ロピア","業務スーパー","アプロ","OK","関西スーパー"];
const $ = id => document.getElementById(id);

const read = (k, fallback) => { try { const v = JSON.parse(localStorage.getItem(k)); return v ?? fallback; } catch { return fallback; } };
const write = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch {} };

let stores = read(STORE_KEY, null);
if (!Array.isArray(stores) || !stores.length) stores = DEFAULT_STORES.slice();
let selected = null;

function setStatus(msg, isErr = false) { $("status").textContent = msg; $("status").className = isErr ? "err" : ""; }
function today() { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); }
const yen = n => Number(n).toLocaleString("ja-JP") + "円";

/* ---------- 店ボタン ---------- */
function renderStores() {
  const box = $("stores"); box.innerHTML = "";
  stores.forEach(name => {
    const b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = name;
    b.setAttribute("aria-pressed", String(selected === name));
    b.onclick = () => { selected = selected === name ? null : name; renderStores(); };
    box.appendChild(b);
  });
  const add = document.createElement("button");
  add.type = "button"; add.className = "chip add"; add.textContent = "＋ 店を追加";
  add.onclick = () => { $("addRow").classList.add("open"); $("newStore").focus(); };
  box.appendChild(add);
}
function closeAdd() { $("addRow").classList.remove("open"); $("newStore").value = ""; }
function commitStore() {
  const v = $("newStore").value.trim();
  if (!v) return;
  if (!stores.includes(v)) stores.push(v);
  selected = v; write(STORE_KEY, stores); closeAdd(); renderStores();
}
$("addOk").onclick = commitStore;
$("addCancel").onclick = closeAdd;
$("newStore").addEventListener("keydown", e => { if (e.key === "Enter") { e.preventDefault(); commitStore(); } });
$("amount").addEventListener("input", e => { e.target.value = e.target.value.replace(/[^0-9]/g, ""); });

/* ---------- 送信キュー（端末に保存 → まとめて送信） ---------- */
// 入力は即座に端末へ保存する。シートへの送信は、次のいずれかのときにまとめて行う:
//  ・未送信が BATCH_SIZE 件たまったとき
//  ・アプリを閉じる／別のアプリに切り替えたとき
//  ・「今すぐ送信」を押したとき
const BATCH_SIZE = 5;
const loadQueue = () => read(QUEUE_KEY, []);
const saveQueue = q => write(QUEUE_KEY, q);
function showPending() {
  const n = loadQueue().length;
  $("pending").textContent = n ? `端末に保存中: ${n}件（未送信）` : "";
  $("flushNow").hidden = !n;
  $("clearQueue").hidden = !n;
}
let lastError = "";
async function postRows(rows, keepalive = false) {
  // 通信の一時的な失敗に備え、1.5秒待って1回だけ再試行する（アプリを閉じるときは再試行しない）。
  // 再試行しても、行のIDでGAS側が重複を弾くので二重登録にはならない。
  const attempts = keepalive ? 1 : 2;
  for (let i = 0; i < attempts; i++) {
    lastError = "";
    let res = null;
    try {
      // Content-Type を指定しない（text/plain）ことで CORS プリフライトを避ける
      res = await fetch(GAS_URL, { method: "POST", keepalive, body: JSON.stringify({ secret: SECRET, rows }) });
    } catch (e) {
      lastError = `通信に失敗しました（${e.message || e.name}）`;
    }
    if (res) {
      try {
        const json = await res.json();
        if (json.ok === true) return true;
        lastError = json.error === "unauthorized" ? "SECRETがGAS側と一致しません" : String(json.error || "不明なエラー");
        return false; // GASが返した明確なエラーは再試行しない
      } catch {
        lastError = `GASの応答を読み取れませんでした（HTTP ${res.status}）`;
      }
    }
    if (i < attempts - 1) await new Promise(r => setTimeout(r, 1500));
  }
  return false;
}

/* ---------- 今月の合計 ---------- */
let serverTotals = null; // {month, totals:{食費, 外食}} シート上の合計（未送信分を含まない）
const monthOf = () => ($("date").value || today()).slice(0, 7);

function renderSummary() {
  const month = monthOf();
  $("sumTitle").textContent = `${Number(month.slice(5))}月の合計`;
  const base = serverTotals && serverTotals.month === month ? serverTotals.totals : null;
  const pend = loadQueue().filter(r => r.date.slice(0, 7) === month);
  const val = cat => base ? (base[cat] || 0) + pend.filter(r => r.category === cat).reduce((s, r) => s + r.amount, 0) : null;
  $("sumFood").textContent = base ? yen(val("食費")) : "—";
  $("sumEat").textContent = base ? yen(val("外食")) : "—";
  $("sumNote").textContent = !base ? "合計を取得できていません" : pend.length ? "未送信分を含みます" : "";
}
async function fetchSummary() {
  const month = monthOf();
  if (!navigator.onLine) return renderSummary();
  try {
    const url = `${GAS_URL}?action=summary&month=${month}&secret=${encodeURIComponent(SECRET)}`;
    const json = await (await fetch(url)).json();
    if (json.ok) { serverTotals = { month, totals: json.totals }; write(SUM_KEY, serverTotals); }
  } catch {}
  renderSummary();
}
// 送信済みになった行を、シート側の合計に加える（再取得までの見た目のずれ防止）
function addToServerTotals(rows) {
  if (!serverTotals) return;
  rows.forEach(r => {
    if (r.date.slice(0, 7) === serverTotals.month && r.category in serverTotals.totals) serverTotals.totals[r.category] += r.amount;
  });
  write(SUM_KEY, serverTotals);
}

let flushing = false;
async function flushQueue(manual = false, keepalive = false) {
  if (flushing || !navigator.onLine) return;
  const q = loadQueue();
  if (!q.length) return;
  flushing = true;
  if (manual) setStatus("送信中…");
  let sent = 0;
  for (let i = 0; i < q.length; i += 50) {
    const chunk = q.slice(i, i + 50);
    if (!(await postRows(chunk, keepalive))) break;
    const ids = new Set(chunk.map(r => r.id));
    saveQueue(loadQueue().filter(r => !ids.has(r.id)));
    addToServerTotals(chunk);
    sent += chunk.length;
  }
  flushing = false;
  showPending(); renderSummary();
  if (sent) { setStatus(`${sent}件をシートに送信しました`); fetchSummary(); }
  else if (!keepalive) setStatus("送信できませんでした: " + lastError, true);
}

/* ---------- 入力 ---------- */
$("form").addEventListener("submit", e => {
  e.preventDefault();
  if (!$("amount").value) { setStatus("金額を入力してください", true); $("amount").focus(); return; }
  const row = {
    id: (crypto.randomUUID ? crypto.randomUUID() : Date.now() + "-" + Math.random().toString(36).slice(2)),
    sentAt: new Date().toISOString(), date: $("date").value || today(), category: $("category").value,
    store: selected || "", amount: Number($("amount").value), memo: $("memo").value
  };
  saveQueue([...loadQueue(), row]);
  $("amount").value = ""; $("memo").value = ""; selected = null;
  $("category").selectedIndex = 0; // 日付は変更しない（続けて同じ日付で入力できる）
  setStatus("保存しました");
  renderStores(); showPending(); renderSummary();
  if (loadQueue().length >= BATCH_SIZE) flushQueue();
});

$("flushNow").onclick = () => flushQueue(true);
$("clearQueue").onclick = () => {
  if (flushing) { setStatus("送信中のため、完了してから削除してください", true); return; }
  const n = loadQueue().length;
  if (!n || !confirm(`未送信の${n}件を端末から削除します。シートには送信されません。よろしいですか？`)) return;
  saveQueue([]);
  showPending(); renderSummary();
  setStatus(`未送信の${n}件を削除しました`);
};
$("date").addEventListener("change", fetchSummary);
window.addEventListener("online", () => flushQueue());
document.addEventListener("visibilitychange", () => { if (document.visibilityState === "hidden") flushQueue(false, true); });
window.addEventListener("pagehide", () => flushQueue(false, true));

$("date").value = today();
serverTotals = read(SUM_KEY, null);
renderStores(); renderSummary(); showPending();
fetchSummary();
flushQueue();

if ("serviceWorker" in navigator) navigator.serviceWorker.register("sw.js").catch(console.error);
</script>
</body>
</html>
